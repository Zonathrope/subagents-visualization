[package]
name = "subagents"
version = "0.1.0"
description = "Live graph of Claude Code sessions, jobs and subagents"
authors = ["Zonathrope"]
license = "MIT"
repository = "https://github.com/Zonathrope/subagents-visualization"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "subagents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
portable-pty = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
